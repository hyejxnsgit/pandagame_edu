<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>대나무숲 한 문장</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;font-weight:500;color:#2f3b2a;background:#dcebd3}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#top{position:fixed;top:14px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
#top b{background:rgba(255,255,255,.85);padding:8px 16px;border-radius:999px;font-size:20px}
#count{background:#2f5d3a;color:#fff;padding:8px 16px;border-radius:999px;font-size:20px}
#echo{position:fixed;top:16%;left:50%;transform:translateX(-50%);text-align:center;font-size:clamp(20px,3vw,34px);color:#fff;text-shadow:0 2px 10px rgba(30,60,30,.6);opacity:0;transition:opacity .4s;pointer-events:none;width:90%}
#echo small{font-size:.7em;opacity:.8}
#panel{display:none;position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(860px,94vw);background:rgba(255,253,246,.96);border-radius:26px;padding:18px 22px 16px;box-shadow:0 10px 30px rgba(40,70,40,.25)}
#unit{font-size:15px;color:#4c7a45;margin-bottom:4px}
#ko{font-size:clamp(20px,2.4vw,28px);margin-bottom:10px}
#input{width:100%;font-family:inherit;font-size:clamp(18px,2.2vw,26px);padding:12px 14px;border:3px solid #b9d3ad;border-radius:16px;resize:none;height:62px;outline:none}
#input:focus{border-color:#4c7a45}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:10px}
#msg,#shoutMsg{font-size:17px;color:#566650}
.btn{font-family:inherit;font-size:18px;border:0;border-radius:14px;padding:10px 20px;background:#2f5d3a;color:#fff;cursor:pointer}
#hint{margin-top:8px}#hint span{display:inline-block;background:#e8f2e1;border:2px dashed #8bb57d;border-radius:10px;padding:3px 10px;margin:3px 6px 0 0;font-size:17px}
#shoutBox{display:none}
.shoutRow{display:flex;gap:16px;align-items:stretch}
#big{flex:1;font-size:clamp(22px,2.8vw,34px);line-height:1.3}
#why{font-size:16px;color:#4c7a45;margin-top:6px}
#meter{width:34px;border-radius:12px;background:#e6efe0;position:relative;overflow:hidden;min-height:96px}
#meterFill{position:absolute;bottom:0;left:0;right:0;height:0;background:linear-gradient(#f59e0b,#ef6f3c);transition:height .08s}
#fill{height:14px;border-radius:99px;background:#e6efe0;overflow:hidden;margin-top:10px}
#fillBar{height:100%;width:0;background:#4c7a45}
#micState{font-size:13px;color:#7b8a74;margin-top:6px}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(calc(-50% - 10px))}75%{transform:translateX(calc(-50% + 10px))}}
#intro{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(220,235,211,.55)}
#intro .card{background:#fffdf6;border-radius:28px;padding:30px 34px;width:min(560px,92vw);box-shadow:0 10px 30px rgba(40,70,40,.25)}
#intro h1{font-size:36px;margin-bottom:12px}
#intro li{font-size:19px;margin:8px 0 8px 22px;line-height:1.4}
#intro .btn{margin-top:16px;width:100%;font-size:22px;padding:14px}
#correct{position:fixed;top:30%;left:50%;transform:translate(-50%,-50%) scale(0);font-size:clamp(56px,9vw,110px);color:#fff;background:#3f8a3c;padding:6px 38px 14px;border-radius:40px;box-shadow:0 10px 0 #2f6a2d,0 18px 40px rgba(30,60,30,.35);pointer-events:none;opacity:0;white-space:nowrap}
#correct.pop{animation:pop 1.1s ease-out forwards}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.2) rotate(-8deg);opacity:0}25%{transform:translate(-50%,-50%) scale(1.15) rotate(3deg);opacity:1}40%{transform:translate(-50%,-50%) scale(1) rotate(0)}80%{opacity:1}100%{transform:translate(-50%,-60%) scale(1);opacity:0}}
#input.good{border-color:#3f8a3c;background:#eef8ea;animation:glow .5s 2}
@keyframes glow{50%{box-shadow:0 0 0 8px rgba(63,138,60,.25)}}
/* 굵기: 강조 600(SemiBold) · 나머지 500(Medium) */
button,textarea,input{font-family:inherit;font-weight:500}
b,strong,h1,#top b,#count,.btn,#correct,#ko,#big,#intro h1{font-weight:600}
#input::placeholder{color:#c3ccbd}
#pre{display:inline-block;margin:-2px 0 10px;padding:5px 12px;border-radius:12px;background:#eef6ff;border:2px solid #b9d2f3;color:#2f4f7a;font-size:18px}
#pre b{color:#2F6FED}#pre small{font-size:14px;color:#6a7f99}
</style></head><body>
<canvas id="c"></canvas>
<div id="top"><span></span><span style="display:flex;gap:8px;pointer-events:auto"><button id="mute" style="font-size:20px;border:0;border-radius:999px;background:rgba(255,255,255,.85);padding:6px 12px;cursor:pointer">🔊</button><span id="count">🎋 0 / 12</span></span></div>
<div id="echo"></div>
<div id="correct">⭕ 정답!</div>
<div id="intro"><div class="card">
 <h1>대나무숲 한 문장</h1>
 <ol>
  <li>한국어 문장을 보고 영어 문장을 직접 씁니다.</li>
  <li>맞으면 광장에 <b>빛나는 자리</b>가 생깁니다. 판다를 걸어가게 해서 그 자리에 섭니다.<br><small>방향키(WASD) 또는 가고 싶은 곳을 화면에서 누르기</small></li>
  <li>그 자리에서 문장을 <b>크게</b> 외칩니다.</li>
  <li>게이지가 다 차면 내 대나무가 한 그루 자랍니다.</li>
  <li>12그루를 키우면 성공입니다!</li>
 </ol>
 <button class="btn" id="start">숲으로 들어가기</button>
</div></div>
<div id="panel">
 <div id="writeBox">
  <div id="unit"></div><div id="ko"></div><div id="pre"></div>
  <textarea id="input" placeholder="여기에 영어 문장을 써 봅시다" spellcheck="false"></textarea>
  <div id="hint"></div>
  <div class="row"><span id="msg"></span><button class="btn" onclick="check()">확인</button></div>
 </div>
 <div id="shoutBox">
  <div class="shoutRow"><div style="flex:1"><div id="big"></div><div id="why"></div></div><div id="meter"><div id="meterFill"></div></div></div>
  <div id="fill"><div id="fillBar"></div></div>
  <div class="row"><span id="shoutMsg"></span><button class="btn" id="next" style="display:none">다음 문제</button></div>
 </div>
 <div id="micState"></div>
</div>
<script>/*THREE*/</script>
<script>/*GAME*/</script>
</body></html>
